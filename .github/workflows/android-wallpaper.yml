name: Conway Android wallpaper

on:
  push:
    branches:
      - android-infinite-wallpaper
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

env:
  EDRIC_REF: 9b0bf7fa8be9483440e6ec0530f3aef3999a8735
  SHADER_BACKEND_REF: 7876b79058d6f59711151a21697369c1cf72df2f

jobs:
  compilers:
    uses: ./.github/workflows/ick-compilers.yml

  apk:
    needs: compilers
    runs-on: ubuntu-latest
    timeout-minutes: 25
    env:
      CONWAY_TEST_KEYSTORE: ${{ github.workspace }}/.test-signing/_/build/app/wegert-debug.keystore
      CONWAY_TEST_KEYSTORE_PASSWORD: wegert-debug
      CONWAY_TEST_KEY_PASSWORD: wegert-debug
      CONWAY_TEST_KEY_ALIAS: wegert-debug
    steps:
      - name: Check out Conway
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}

      - name: Check out shared ICK source producer
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          repository: isomorphisms/ai-ci
          ref: 903b2cb27ea572c9c6cb2ffa9f39e0fbf06ec9f8
          path: .ai-ci-ick

      - name: Download qualified compiler stages
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093
        with:
          pattern: ick-*
          path: build/ick-packages
          merge-multiple: true

      - name: Restore the qualified compiler stages
        run: |
          make -f .ai-ci-ick/ick-android/Makefile restore-stage ABI=armeabi-v7a ICK_STAGE="$GITHUB_WORKSPACE/build/ick/armeabi-v7a" ICK_ARCHIVE="$GITHUB_WORKSPACE/build/ick-packages/ick-armeabi-v7a.tar.gz"
          make -f .ai-ci-ick/ick-android/Makefile restore-stage ABI=arm64-v8a ICK_STAGE="$GITHUB_WORKSPACE/build/ick/arm64-v8a" ICK_ARCHIVE="$GITHUB_WORKSPACE/build/ick-packages/ick-arm64-v8a.tar.gz"
          make -f .ai-ci-ick/ick-android/Makefile restore-stage ABI=x86_64 ICK_STAGE="$GITHUB_WORKSPACE/build/ick/x86_64" ICK_ARCHIVE="$GITHUB_WORKSPACE/build/ick-packages/ick-x86_64.tar.gz"

      - name: Check out stable public test signer
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          repository: isomorphismes/wegert
          ref: 89dcfb840cec1a66ee04c7f7404954cbd6c09839
          path: .test-signing
          sparse-checkout: _/build/app/wegert-debug.keystore
          sparse-checkout-cone-mode: false

      - uses: actions/setup-java@cf277c60eb25467037889841efdb72551f06f6c3
        with:
          distribution: temurin
          java-version: '17'

      - uses: android-actions/setup-android@be39fa834029ff78f1a44aa3bb0819b8fc2bd8fd
        with:
          packages: ''

      - name: Install Android toolchain
        run: |
          sdkmanager "platforms;android-36" "build-tools;36.0.0" "ndk;29.0.14206865" "cmake;3.22.1"

      - uses: gradle/actions/setup-gradle@ed408507eac070d1f99cc633dbcf757c94c7933a
        with:
          gradle-version: '9.5.0'

      - name: Check bundled wallpaper shader
        run: |
          test -s boilerplate/android/app/src/main/assets/conway-wallpaper.frag
          grep -q 'uniform vec2 u_pan' boilerplate/android/app/src/main/assets/conway-wallpaper.frag
          grep -q 'uniform float u_aspect' boilerplate/android/app/src/main/assets/conway-wallpaper.frag

      - name: Build debug APK
        shell: bash
        run: |
          set -o pipefail
          gradle -p boilerplate/android --no-daemon --stacktrace :app:assembleDebug 2>&1 | tee android-build.log

      - name: Verify finished APK signer against central registry
        uses: isomorphisms/ai-ci/android-signing@b3af13b3ab2bac9dd7c72bf9dd855ed5a17609b5
        with:
          apk: boilerplate/android/app/build/outputs/apk/debug/app-debug.apk
          lane: test

      - name: Verify declared source producers
        uses: isomorphisms/ai-ci@903b2cb27ea572c9c6cb2ffa9f39e0fbf06ec9f8
        with:
          suite: ci/build-toolchain-suite.tsv
          root: .

      - name: Upload Android build log
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: conway-android-build-log
          path: android-build.log
          if-no-files-found: warn

      - name: Verify APK contents
        run: |
          unzip -l boilerplate/android/app/build/outputs/apk/debug/app-debug.apk > "$RUNNER_TEMP/apk-files"
          grep -q 'lib/arm64-v8a/libconway.so' "$RUNNER_TEMP/apk-files"
          grep -q 'lib/armeabi-v7a/libconway.so' "$RUNNER_TEMP/apk-files"
          grep -q 'lib/x86_64/libconway.so' "$RUNNER_TEMP/apk-files"
          grep -q 'assets/conway-wallpaper.frag' "$RUNNER_TEMP/apk-files"

      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: conway-debug-apk
          path: boilerplate/android/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error

  shader-source:
    runs-on: ubuntu-latest
    timeout-minutes: 55
    steps:
      - name: Check out Conway
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}

      - name: Install compiler and shader dependencies
        run: |
          sudo apt-get update
          sudo apt-get install --yes chezscheme glslang-tools libgmp-dev

      - name: Check out Edric
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          repository: isomorphisms/Idric
          ref: ${{ env.EDRIC_REF }}
          path: idric

      - name: Check out Idris shader backend
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          repository: isomorphisms/idris-shader-backend
          ref: ${{ env.SHADER_BACKEND_REF }}
          path: shader-backend

      - name: Build self-hosted Edric and compiler API
        shell: bash
        run: |
          set -euxo pipefail
          make -C idric bootstrap SCHEME=chezscheme
          make -C idric install PREFIX="$HOME/.idris2"
          export PATH="$HOME/.idris2/bin:$PATH"
          make -C idric clean
          make -C idric all IDRIS2_BOOT="$HOME/.idris2/bin/idris2"
          make -C idric install PREFIX="$HOME/.idris2"
          make -C idric install-api PREFIX="$HOME/.idris2"
          idris2 --version

      - name: Build GLSL ES backend against Edric
        run: |
          echo "$HOME/.idris2/bin" >> "$GITHUB_PATH"
          PATH="$HOME/.idris2/bin:$PATH" make -C shader-backend backend

      - name: Compile Conway wallpaper source
        shell: bash
        run: |
          set -euxo pipefail
          cp wallpapers/ConwayWallpaper.idric shader-backend/src/Example/ConwayWallpaper.idr
          (
            cd shader-backend
            ./build/exec/idris2-glsles \
              --cg glsles \
              --source-dir src \
              --output-dir generated \
              src/Example/ConwayWallpaper.idr \
              -o conway-wallpaper
          )
          test -s shader-backend/generated/conway-wallpaper.frag
          glslangValidator -S frag shader-backend/generated/conway-wallpaper.frag
          grep -q 'uniform vec2 u_pan' shader-backend/generated/conway-wallpaper.frag
          grep -q 'uniform float u_aspect' shader-backend/generated/conway-wallpaper.frag

      - name: Upload generated wallpaper shader
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: conway-generated-wallpaper-shader
          path: shader-backend/generated/conway-wallpaper.frag
          if-no-files-found: warn

      - name: Check generated shader matches bundled artifact
        run: |
          diff -u boilerplate/android/app/src/main/assets/conway-wallpaper.frag shader-backend/generated/conway-wallpaper.frag

  emulate:
    needs: apk
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}

      - uses: actions/setup-java@cf277c60eb25467037889841efdb72551f06f6c3
        with:
          distribution: temurin
          java-version: '17'

      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093
        with:
          name: conway-debug-apk
          path: artifacts

      - name: Enable KVM permissions
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm

      - name: Emulate phone and smoke-test Conway
        uses: reactivecircus/android-emulator-runner@a421e43855164a8197daf9d8d40fe71c6996bb0d
        with:
          api-level: 34
          target: default
          arch: x86_64
          profile: medium_phone
          ram-size: 2048M
          disable-animations: true
          emulator-options: -no-window -gpu swiftshader_indirect -noaudio -no-boot-anim -no-snapshot-save -no-metrics
          script: |
            adb shell wm size 720x1280
            adb shell wm density 320
            adb install -r artifacts/app-debug.apk
            adb install -r artifacts/app-debug.apk
            adb logcat -c
            adb shell am start -W -a android.intent.action.MAIN -c android.intent.category.LAUNCHER -n org.isomorphisms.conway/android.app.NativeActivity
            sleep 4
            adb exec-out screencap -p > conway-before.png
            adb shell input swipe 180 640 420 640 450
            sleep 2
            adb exec-out screencap -p > conway-after-pan.png
            adb logcat -d > conway-phone.log
            adb shell pidof -s org.isomorphisms.conway | tr -d '\r' | grep -Eq '^[0-9]+$'
            ! grep -Eiq 'shader compilation failed|program link failed|eglInitialize failed|could not choose GLES3 EGL config|could not create EGL surface/context|eglMakeCurrent failed|could not open asset|missing pan/aspect' conway-phone.log
            ! cmp -s conway-before.png conway-after-pan.png

      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: always()
        with:
          name: conway-phone-emulator-evidence
          path: |
            conway-before.png
            conway-after-pan.png
            conway-phone.log
          if-no-files-found: warn
